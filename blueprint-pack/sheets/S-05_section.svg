<text x="36.00" y="480.00" font-size="2.65" text-anchor="start" fill="#141414">PANEL BUILD-UP IS EXAGGERATED.  GAUGE, SEALANT, AND BOLT GRADE ARE TBD.  THIS SHEET HAS ONE LENGTH DATUM SET — NO SECOND OAL.</text>
<text x="36.00" y="492.00" font-size="2.65" text-anchor="start" fill="#141414">CAB OUTLINE IS DASHED (NOT IN SHELL SCOPE).  HATCH IS A CUT SYMBOL, NOT A MATERIAL SPEC.</text>
