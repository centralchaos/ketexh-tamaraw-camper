<text x="19.00" y="404.70" font-size="2.55" text-anchor="start" fill="#141414">+ splash box. Sealant product TBD.</text>
<text x="19.00" y="409.40" font-size="2.55" text-anchor="start" fill="#141414">Cab–over-cab: reverse lap or gasket.</text>
<text x="19.00" y="414.10" font-size="2.55" text-anchor="start" fill="#141414">No blind pocket. Weep must daylight.</text>
<text x="19.00" y="418.80" font-size="2.55" text-anchor="start" fill="#141414">Do not drain into the loft.</text>
<text x="19.00" y="423.50" font-size="2.55" text-anchor="start" fill="#141414">Glands are not a drain path.</text>
