<text x="290.67" y="414.10" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF trapped water.</text>
<text x="290.67" y="418.80" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF wet glands.</text>
<text x="290.67" y="423.50" font-size="2.55" text-anchor="start" fill="#141414">Splash box drains; it is not a sensor pocket.</text>
