<text x="48.00" y="68.00" font-size="2.45" text-anchor="start" fill="#141414" font-weight="bold">SILL — STRUCTURE</text>
<text x="104.00" y="122.00" font-size="2.30" text-anchor="start" fill="#141414">ISOLATOR PAD TBD</text>
<text x="70.00" y="182.00" font-size="2.40" text-anchor="start" fill="#141414" font-weight="bold">OUTRIGGER — D-01</text>
<text x="300.00" y="60.00" font-size="2.40" text-anchor="start" fill="#141414" font-weight="bold">SERVICE DOOR</text>
<text x="300.00" y="180.00" font-size="2.35" text-anchor="start" fill="#141414" font-weight="bold">HINGE ON THE POST</text>
<text x="40.00" y="206.00" font-size="2.45" text-anchor="start" fill="#9b1c1c" font-weight="bold">FAIL-IF THE MASS IS ON THE +1000 SKIN ONLY.</text>
<text x="40.00" y="222.00" font-size="2.40" text-anchor="start" fill="#141414">BOLT GRADE AND QTY ARE TBD. ENG GO IS EMPTY.</text>
<rect x="528.00" y="16.00" width="297.00" height="228.00" fill="#ffffff" stroke="#141414" stroke-width="0.45"/>
<rect x="528.00" y="16.00" width="297.00" height="8.00" fill="#141414" stroke="none" stroke-width="0.35"/>
<text x="530.50" y="21.70" font-size="3.00" text-anchor="start" fill="#ffffff" font-weight="bold">2  EXHAUST, FILL, WEEP</text>
<text x="544.00" y="44.00" font-size="2.60" text-anchor="start" fill="#141414" font-weight="bold">EXHAUST HARDPOINT</text>
<text x="544.00" y="60.00" font-size="2.40" text-anchor="start" fill="#141414">Away from the lounge hatch,</text>
<text x="544.00" y="74.00" font-size="2.40" text-anchor="start" fill="#141414">the lounge intake, and the</text>
<text x="544.00" y="88.00" font-size="2.40" text-anchor="start" fill="#141414">over-cab intake.</text>
<text x="544.00" y="110.00" font-size="2.60" text-anchor="start" fill="#141414" font-weight="bold">FUEL FILL AND VENT</text>
<text x="544.00" y="126.00" font-size="2.40" text-anchor="start" fill="#141414">Clear of cabin weep and</text>
<text x="544.00" y="140.00" font-size="2.40" text-anchor="start" fill="#141414">electrical glands.</text>
<text x="544.00" y="162.00" font-size="2.60" text-anchor="start" fill="#141414" font-weight="bold">SPLASH / WEEP</text>
<text x="544.00" y="178.00" font-size="2.40" text-anchor="start" fill="#141414">Continuous with D-06.</text>
<text x="544.00" y="200.00" font-size="2.60" text-anchor="start" fill="#9b1c1c" font-weight="bold">PARKED-ONLY RUN.</text>
<text x="544.00" y="216.00" font-size="2.45" text-anchor="start" fill="#141414" font-weight="bold">NO kW ON THIS SHEET.</text>
<rect x="16.00" y="254.00" width="260.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="146.00" y="266.00" font-size="2.70" text-anchor="middle" fill="#9b1c1c" font-weight="bold">FAIL-IF EXHAUST OR CO IN CABIN</text>
<text x="146.00" y="278.00" font-size="2.30" text-anchor="middle" fill="#9b1c1c">LOUNGE AND CABIN BOTH</text>
<rect x="286.00" y="254.00" width="260.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="416.00" y="266.00" font-size="2.70" text-anchor="middle" fill="#9b1c1c" font-weight="bold">FAIL-IF MASS ON SKIN ONLY</text>
<text x="416.00" y="278.00" font-size="2.30" text-anchor="middle" fill="#9b1c1c">NEEDS OUTRIGGERS AND LEGS</text>
<rect x="556.00" y="254.00" width="268.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="690.00" y="266.00" font-size="2.70" text-anchor="middle" fill="#9b1c1c" font-weight="bold">FAIL-IF WET GLANDS</text>
<text x="690.00" y="278.00" font-size="2.30" text-anchor="middle" fill="#9b1c1c">OR A RAIL DRILL WITHOUT JAY GO</text>
<rect x="16.00" y="298.00" width="250.00" height="28.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.55"/>
<rect x="24.00" y="306.00" width="7.00" height="7.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="38.00" y="312.00" font-size="2.50" text-anchor="start" fill="#141414" font-weight="bold">JAY GO — RAIL DRILL UNSIGNED</text>
<rect x="276.00" y="298.00" width="250.00" height="28.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.55"/>
<rect x="284.00" y="306.00" width="7.00" height="7.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="298.00" y="312.00" font-size="2.50" text-anchor="start" fill="#141414" font-weight="bold">ENG GO — PAD BOLTS UNSIGNED</text>
<rect x="536.00" y="298.00" width="288.00" height="28.00" fill="#ffffff" stroke="#141414" stroke-width="0.45"/>
<text x="548.00" y="312.00" font-size="2.50" text-anchor="start" fill="#141414" font-weight="bold">MAX kg BLANK UNTIL WEIGH</text>
<rect x="16.00" y="336.00" width="265.67" height="164.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="19.00" y="344.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">ENG — BAY</text>
<text x="19.00" y="352.00" font-size="2.55" text-anchor="start" fill="#141414">Frame the bay to the sill and</text>
<text x="19.00" y="356.70" font-size="2.55" text-anchor="start" fill="#141414">to the outriggers. Not to skin.</text>
<text x="19.00" y="361.40" font-size="2.55" text-anchor="start" fill="#141414">Isolator pad plate. Grade TBD.</text>
<text x="19.00" y="366.10" font-size="2.55" text-anchor="start" fill="#141414">Quantity TBD. Eng GO is empty.</text>
<text x="19.00" y="370.80" font-size="2.55" text-anchor="start" fill="#141414">Service-door hinge lands on</text>
<text x="19.00" y="375.50" font-size="2.55" text-anchor="start" fill="#141414">the post, not on the sheet.</text>
<text x="19.00" y="380.20" font-size="2.55" text-anchor="start" fill="#141414">Exhaust stays clear of the</text>
<text x="19.00" y="384.90" font-size="2.55" text-anchor="start" fill="#141414">hatch and of both intakes.</text>
<text x="19.00" y="389.60" font-size="2.55" text-anchor="start" fill="#141414">No generator kW is stated.</text>
<rect x="287.67" y="336.00" width="265.67" height="164.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="290.67" y="344.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FIELD — RUN / WATER</text>
<text x="290.67" y="352.00" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF exhaust or CO enters</text>
<text x="290.67" y="356.70" font-size="2.55" text-anchor="start" fill="#141414">the lounge or the cabin.</text>
<text x="290.67" y="361.40" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF the mass sits on the</text>
<text x="290.67" y="366.10" font-size="2.55" text-anchor="start" fill="#141414">+1000 skin, or has no legs</text>
<text x="290.67" y="370.80" font-size="2.55" text-anchor="start" fill="#141414">when the bay is occupied.</text>
<text x="290.67" y="375.50" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF glands are wet.</text>
<text x="290.67" y="380.20" font-size="2.55" text-anchor="start" fill="#141414">Run is parked only.</text>
<text x="290.67" y="384.90" font-size="2.55" text-anchor="start" fill="#141414">Keep the D-06 weep open.</text>
<text x="290.67" y="389.60" font-size="2.55" text-anchor="start" fill="#141414">Placard stays blank.</text>
<rect x="559.33" y="336.00" width="265.67" height="164.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="562.33" y="344.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FSD — NOT A BUY LIST</text>
<text x="562.33" y="352.00" font-size="2.55" text-anchor="start" fill="#141414">FSD = fabricator shop decision.</text>
<text x="562.33" y="356.70" font-size="2.55" text-anchor="start" fill="#141414">Do not buy a generator from</text>
<text x="562.33" y="361.40" font-size="2.55" text-anchor="start" fill="#141414">this sheet. Unit is not Done.</text>
<text x="562.33" y="366.10" font-size="2.55" text-anchor="start" fill="#141414">Do not invent a bolt grade.</text>
<text x="562.33" y="370.80" font-size="2.55" text-anchor="start" fill="#141414">Fill and vent stay clear of</text>
<text x="562.33" y="375.50" font-size="2.55" text-anchor="start" fill="#141414">weep and electrical glands.</text>
<text x="562.33" y="380.20" font-size="2.55" text-anchor="start" fill="#141414">Unsigned Jay GO = no rail hole.</text>
<text x="562.33" y="384.90" font-size="2.55" text-anchor="start" fill="#141414">Unsigned Eng GO = no pad bolts.</text>
<text x="562.33" y="389.60" font-size="2.55" text-anchor="start" fill="#141414">Not an LTO release.</text>
