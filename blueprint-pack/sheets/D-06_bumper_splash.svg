<text x="562.33" y="352.00" font-size="2.55" text-anchor="start" fill="#141414">FSD = fabricator shop decision.</text>
<text x="562.33" y="356.70" font-size="2.55" text-anchor="start" fill="#141414">Do not copy the render bumper.</text>
<text x="562.33" y="361.40" font-size="2.55" text-anchor="start" fill="#141414">Do not state a departure angle.</text>
<text x="562.33" y="366.10" font-size="2.55" text-anchor="start" fill="#141414">Sealant and gland parts: TBD.</text>
<text x="562.33" y="370.80" font-size="2.55" text-anchor="start" fill="#141414">Do not drill the chassis rail</text>
<text x="562.33" y="375.50" font-size="2.55" text-anchor="start" fill="#141414">to hang the bumper.</text>
<text x="562.33" y="380.20" font-size="2.55" text-anchor="start" fill="#141414">Leg swing check is on the</text>
<text x="562.33" y="384.90" font-size="2.55" text-anchor="start" fill="#141414">vehicle, with D-02.</text>
<text x="562.33" y="389.60" font-size="2.55" text-anchor="start" fill="#141414">Unsigned Jay GO = NO-GO.</text>
