<text x="19.00" y="344.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">ENG — INTERFACE</text>
<text x="19.00" y="352.00" font-size="2.55" text-anchor="start" fill="#141414">Bumper meets the shell sill</text>
<text x="19.00" y="356.70" font-size="2.55" text-anchor="start" fill="#141414">under the +1000 tail.</text>
<text x="19.00" y="361.40" font-size="2.55" text-anchor="start" fill="#141414">Keep the belly splash and the</text>
<text x="19.00" y="366.10" font-size="2.55" text-anchor="start" fill="#141414">D-03 weep. Do not dam them.</text>
<text x="19.00" y="370.80" font-size="2.55" text-anchor="start" fill="#141414">Hitch stays clear of the</text>
<text x="19.00" y="375.50" font-size="2.55" text-anchor="start" fill="#141414">landing-leg swing. Gap TBD.</text>
<text x="19.00" y="380.20" font-size="2.55" text-anchor="start" fill="#141414">No new departure angle is</text>
<text x="19.00" y="384.90" font-size="2.55" text-anchor="start" fill="#141414">stated. Confirm as-found.</text>
<rect x="287.67" y="336.00" width="265.67" height="164.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="290.67" y="344.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FIELD IoT — SPLASH / GLANDS</text>
<text x="290.67" y="352.00" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF water is trapped under</text>
<text x="290.67" y="356.70" font-size="2.55" text-anchor="start" fill="#141414">the occupied tail.</text>
<text x="290.67" y="361.40" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF lamp or mudflap glands</text>
<text x="290.67" y="366.10" font-size="2.55" text-anchor="start" fill="#141414">are wet at this interface.</text>
<text x="290.67" y="370.80" font-size="2.55" text-anchor="start" fill="#141414">Weep must still daylight after</text>
<text x="290.67" y="375.50" font-size="2.55" text-anchor="start" fill="#141414">the bumper is fitted.</text>
<text x="290.67" y="380.20" font-size="2.55" text-anchor="start" fill="#141414">Hose this joint with D-03.</text>
<text x="290.67" y="384.90" font-size="2.55" text-anchor="start" fill="#141414">R&amp;D build. Not an LTO release.</text>
<rect x="559.33" y="336.00" width="265.67" height="164.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
