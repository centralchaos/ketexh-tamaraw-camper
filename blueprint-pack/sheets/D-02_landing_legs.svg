<text x="508.00" y="48.00" font-size="2.70" text-anchor="start" fill="#141414" font-weight="bold">PAD L × W × t = TBD × TBD × TBD</text>
<text x="508.00" y="64.00" font-size="2.70" text-anchor="start" fill="#141414">PIN / BOLT Ø AND QTY = TBD</text>
<text x="508.00" y="110.00" font-size="2.55" text-anchor="start" fill="#141414">Holes in the pad are shell-module</text>
<text x="508.00" y="122.00" font-size="2.55" text-anchor="start" fill="#141414">or pad holes. They are not a rail drill.</text>
<text x="508.00" y="140.00" font-size="2.55" text-anchor="start" fill="#141414">Grade: TBD.  Jay GO still governs D-01.</text>
<rect x="488.00" y="174.00" width="337.00" height="110.00" fill="#ffffff" stroke="#141414" stroke-width="0.45"/>
<rect x="488.00" y="174.00" width="337.00" height="8.00" fill="#141414" stroke="none" stroke-width="0.35"/>
<text x="490.50" y="179.70" font-size="3.00" text-anchor="start" fill="#ffffff" font-weight="bold">3  MAX-kg PLACARD — LEAVE BLANK</text>
<rect x="508.00" y="196.00" width="180.00" height="76.00" fill="#ffffff" stroke="#141414" stroke-width="0.6"/>
<text x="598.00" y="210.00" font-size="2.60" text-anchor="middle" fill="#141414" font-weight="bold">KE-Texh / TAMARAW</text>
<text x="598.00" y="226.00" font-size="4.00" text-anchor="middle" fill="#141414" font-weight="bold">MAX kg</text>
<line x1="540.00" y1="240.00" x2="656.00" y2="240.00" stroke="#141414" stroke-width="0.4" fill="none"/>
<text x="598.00" y="254.00" font-size="2.60" text-anchor="middle" fill="#141414">POST-WEIGH ONLY</text>
<text x="598.00" y="266.00" font-size="2.50" text-anchor="middle" fill="#9b1c1c">DO NOT WRITE A NUMBER</text>
<text x="700.00" y="210.00" font-size="2.50" text-anchor="start" fill="#141414">Affix inside</text>
<text x="700.00" y="222.00" font-size="2.50" text-anchor="start" fill="#141414">the entry and</text>
<text x="700.00" y="234.00" font-size="2.50" text-anchor="start" fill="#141414">on the build</text>
<text x="700.00" y="246.00" font-size="2.50" text-anchor="start" fill="#141414">plate after</text>
<text x="700.00" y="258.00" font-size="2.50" text-anchor="start" fill="#141414">axle-scale</text>
<text x="700.00" y="270.00" font-size="2.50" text-anchor="start" fill="#141414">weigh.</text>
<rect x="16.00" y="294.00" width="300.00" height="28.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.6"/>
<rect x="24.00" y="302.00" width="8.00" height="8.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="38.00" y="308.00" font-size="2.70" text-anchor="start" fill="#141414" font-weight="bold">JAY GO — NO RAIL DRILL ON THIS SHEET</text>
<text x="330.00" y="308.00" font-size="2.70" text-anchor="start" fill="#141414">Rail drill stays NO-GO until the D-01 Jay GO box is signed.</text>
<rect x="16.00" y="332.00" width="265.67" height="168.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="19.00" y="340.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">ENG — LEGS</text>
<text x="19.00" y="348.00" font-size="2.55" text-anchor="start" fill="#141414">Hard points under the +1000 tail.</text>
<text x="19.00" y="352.70" font-size="2.55" text-anchor="start" fill="#141414">Foot pad size: TBD.</text>
<text x="19.00" y="357.40" font-size="2.55" text-anchor="start" fill="#141414">Swing / ground / tire clearance: TBD.</text>
<text x="19.00" y="362.10" font-size="2.55" text-anchor="start" fill="#141414">Leg takes occupied overhang off</text>
<text x="19.00" y="366.80" font-size="2.55" text-anchor="start" fill="#141414">the rear suspension when static.</text>
<text x="19.00" y="371.50" font-size="2.55" text-anchor="start" fill="#141414">Do not size the leg from a guessed kg.</text>
<text x="19.00" y="376.20" font-size="2.55" text-anchor="start" fill="#141414">Pin holes: shell module, not the rail.</text>
<text x="19.00" y="380.90" font-size="2.55" text-anchor="start" fill="#141414">Stowed leg must clear the wheel arc.</text>
<text x="19.00" y="385.60" font-size="2.55" text-anchor="start" fill="#141414">Occupied only on stands.</text>
<text x="19.00" y="390.30" font-size="2.55" text-anchor="start" fill="#141414">Prototype only.</text>
<rect x="287.67" y="332.00" width="265.67" height="168.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="290.67" y="340.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FIELD IoT — STANDS / PLACARD</text>
<text x="290.67" y="348.00" font-size="2.55" text-anchor="start" fill="#141414">Habitation load is on the stands</text>
<text x="290.67" y="352.70" font-size="2.55" text-anchor="start" fill="#141414">when the shell is occupied.</text>
<text x="290.67" y="357.40" font-size="2.55" text-anchor="start" fill="#141414">Placard stays blank in this pack.</text>
<text x="290.67" y="362.10" font-size="2.55" text-anchor="start" fill="#141414">No sensor, switch, or label may</text>
<text x="290.67" y="366.80" font-size="2.55" text-anchor="start" fill="#141414">imply a kg rating before weigh.</text>
<text x="290.67" y="371.50" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF a number is written early.</text>
<text x="290.67" y="376.20" font-size="2.55" text-anchor="start" fill="#141414">Weigh on axle scales, then letter.</text>
<text x="290.67" y="380.90" font-size="2.55" text-anchor="start" fill="#141414">GVW / axle / payload remaining</text>
<text x="290.67" y="385.60" font-size="2.55" text-anchor="start" fill="#141414">are filled only after that weigh.</text>
<text x="290.67" y="390.30" font-size="2.55" text-anchor="start" fill="#141414">Do not use a stock-payload guess.</text>
<rect x="559.33" y="332.00" width="265.67" height="168.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="562.33" y="340.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FSD — SHOP DECISION</text>
<text x="562.33" y="348.00" font-size="2.55" text-anchor="start" fill="#141414">FSD = fabricator shop decision.</text>
<text x="562.33" y="352.70" font-size="2.55" text-anchor="start" fill="#141414">Do not cut a pad from an assumed kg.</text>
<text x="562.33" y="357.40" font-size="2.55" text-anchor="start" fill="#141414">Do not drill the chassis rail to</text>
<text x="562.33" y="362.10" font-size="2.55" text-anchor="start" fill="#141414">mount the leg. See D-01.</text>
<text x="562.33" y="366.80" font-size="2.55" text-anchor="start" fill="#141414">Confirm swing clearance on</text>
<text x="562.33" y="371.50" font-size="2.55" text-anchor="start" fill="#141414">this vehicle before the pin pattern.</text>
<text x="562.33" y="376.20" font-size="2.55" text-anchor="start" fill="#141414">Blank placard is the correct state</text>
<text x="562.33" y="380.90" font-size="2.55" text-anchor="start" fill="#141414">of this revision.</text>
<text x="562.33" y="385.60" font-size="2.55" text-anchor="start" fill="#141414">Unsigned Jay GO = NO-GO.</text>
<text x="562.33" y="390.30" font-size="2.55" text-anchor="start" fill="#141414">As-found tape still governs.</text>
