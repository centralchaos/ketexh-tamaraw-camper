<text x="38.00" y="288.00" font-size="2.60" text-anchor="start" fill="#141414" font-weight="bold">JAY GO — NO UNDIRECTED RAIL DRILL</text>
<rect x="16.00" y="312.00" width="265.67" height="188.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="19.00" y="320.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">ENG — MOUNTS</text>
<text x="19.00" y="328.00" font-size="2.55" text-anchor="start" fill="#141414">Bolts land in rear posts or sills.</text>
<text x="19.00" y="332.70" font-size="2.55" text-anchor="start" fill="#141414">Stand-offs. Not skin-only screws.</text>
<text x="19.00" y="337.40" font-size="2.55" text-anchor="start" fill="#141414">Grade, diameter, quantity, and</text>
<text x="19.00" y="342.10" font-size="2.55" text-anchor="start" fill="#141414">spacing are TBD on this sheet.</text>
<text x="19.00" y="346.80" font-size="2.55" text-anchor="start" fill="#141414">Do not invent a grade.</text>
<text x="19.00" y="351.50" font-size="2.55" text-anchor="start" fill="#141414">The ladder is roof access.</text>
<text x="19.00" y="356.20" font-size="2.55" text-anchor="start" fill="#141414">It is not a shell lift and not</text>
<text x="19.00" y="360.90" font-size="2.55" text-anchor="start" fill="#141414">a jack. Do not size it as one.</text>
<rect x="287.67" y="312.00" width="265.67" height="188.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="290.67" y="320.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FIELD IoT — VIBRATION</text>
<text x="290.67" y="328.00" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF the ladder is used to</text>
<text x="290.67" y="332.70" font-size="2.55" text-anchor="start" fill="#141414">lift or jack the shell.</text>
<text x="290.67" y="337.40" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF mounts are loose after</text>
<text x="290.67" y="342.10" font-size="2.55" text-anchor="start" fill="#141414">road vibration.</text>
<text x="290.67" y="346.80" font-size="2.55" text-anchor="start" fill="#141414">Check stand-offs still clamp</text>
<text x="290.67" y="351.50" font-size="2.55" text-anchor="start" fill="#141414">the post, not the outer skin.</text>
<text x="290.67" y="356.20" font-size="2.55" text-anchor="start" fill="#141414">No gland or cable on the ladder</text>
<text x="290.67" y="360.90" font-size="2.55" text-anchor="start" fill="#141414">rail unless it is sealed.</text>
<text x="290.67" y="365.60" font-size="2.55" text-anchor="start" fill="#141414">Prototype only.</text>
<rect x="559.33" y="312.00" width="265.67" height="188.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="562.33" y="320.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FSD — SHOP DECISION</text>
<text x="562.33" y="328.00" font-size="2.55" text-anchor="start" fill="#141414">FSD = fabricator shop decision.</text>
<text x="562.33" y="332.70" font-size="2.55" text-anchor="start" fill="#141414">Do not copy rung spacing off</text>
<text x="562.33" y="337.40" font-size="2.55" text-anchor="start" fill="#141414">the concept render.</text>
<text x="562.33" y="342.10" font-size="2.55" text-anchor="start" fill="#141414">Do not drill the chassis rail</text>
<text x="562.33" y="346.80" font-size="2.55" text-anchor="start" fill="#141414">to hang this ladder.</text>
<text x="562.33" y="351.50" font-size="2.55" text-anchor="start" fill="#141414">Confirm post section as-found.</text>
<text x="562.33" y="356.20" font-size="2.55" text-anchor="start" fill="#141414">Unsigned Jay GO = NO-GO.</text>
<text x="562.33" y="360.90" font-size="2.55" text-anchor="start" fill="#141414">Blank grade cells stay blank.</text>
<text x="562.33" y="365.60" font-size="2.55" text-anchor="start" fill="#141414">Not an LTO access approval.</text>
