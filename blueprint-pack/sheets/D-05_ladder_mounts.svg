<text x="468.00" y="120.00" font-size="2.50" text-anchor="start" fill="#141414">SPACING TBD. CONFIRM ON THE POST.</text>
<text x="468.00" y="136.00" font-size="2.50" text-anchor="start" fill="#141414" font-weight="bold">NOT A CHASSIS-RAIL DRILL.</text>
<text x="468.00" y="156.00" font-size="2.50" text-anchor="start" fill="#141414">See D-01 before any rail hole.</text>
<rect x="448.00" y="186.00" width="377.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="636.50" y="198.00" font-size="2.90" text-anchor="middle" fill="#9b1c1c" font-weight="bold">FAIL-IF LADDER USED AS A JACK OR LIFT</text>
<text x="636.50" y="210.00" font-size="2.35" text-anchor="middle" fill="#9b1c1c">IT IS ROOF ACCESS ONLY</text>
<rect x="448.00" y="230.00" width="377.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="636.50" y="242.00" font-size="2.90" text-anchor="middle" fill="#9b1c1c" font-weight="bold">FAIL-IF MOUNTS LOOSEN AFTER VIBRATION</text>
<text x="636.50" y="254.00" font-size="2.35" text-anchor="middle" fill="#9b1c1c">RE-TORQUE CHECK IS TBD</text>
