<text x="230.00" y="386.00" font-size="2.80" text-anchor="start" fill="#141414">NAME ____________________    DATE ____________    UNTIL SIGNED, DO NOT DRILL THE RAIL.</text>
<rect x="16.00" y="404.00" width="265.67" height="96.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="19.00" y="412.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">ENG — LOAD PATH</text>
<text x="19.00" y="420.00" font-size="2.55" text-anchor="start" fill="#141414">Bolted outriggers to bed rails.</text>
<text x="19.00" y="424.70" font-size="2.55" text-anchor="start" fill="#141414">Do not hang the shell on GI skin.</text>
<text x="19.00" y="429.40" font-size="2.55" text-anchor="start" fill="#141414">Through-bolts + backing plates.</text>
<text x="19.00" y="434.10" font-size="2.55" text-anchor="start" fill="#141414">Isolate dissimilar metals.</text>
<text x="19.00" y="438.80" font-size="2.55" text-anchor="start" fill="#141414">Floor pan lands on outriggers.</text>
<text x="19.00" y="443.50" font-size="2.55" text-anchor="start" fill="#141414">Welds stay inside the shell module.</text>
<text x="19.00" y="448.20" font-size="2.55" text-anchor="start" fill="#141414">Plate size, grade, spacing: TBD.</text>
<text x="19.00" y="452.90" font-size="2.55" text-anchor="start" fill="#141414">No undirected rail drill.</text>
<rect x="287.67" y="404.00" width="265.67" height="96.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="290.67" y="412.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FIELD IoT — SPLASH / GLANDS</text>
<text x="290.67" y="420.00" font-size="2.55" text-anchor="start" fill="#141414">Seal every penetration.</text>
<text x="290.67" y="424.70" font-size="2.55" text-anchor="start" fill="#141414">No gland in the splash plane</text>
<text x="290.67" y="429.40" font-size="2.55" text-anchor="start" fill="#141414">of the rail joint.</text>
<text x="290.67" y="434.10" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF wet gland at the bolts.</text>
<text x="290.67" y="438.80" font-size="2.55" text-anchor="start" fill="#141414">Any loom sits above the weep.</text>
<text x="290.67" y="443.50" font-size="2.55" text-anchor="start" fill="#141414">Do not pocket water on the plate.</text>
<text x="290.67" y="448.20" font-size="2.55" text-anchor="start" fill="#141414">Hose test of this joint: D-03.</text>
<text x="290.67" y="452.90" font-size="2.55" text-anchor="start" fill="#141414">R&amp;D build. Not an LTO release.</text>
<rect x="559.33" y="404.00" width="265.67" height="96.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="562.33" y="412.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FSD — SHOP DECISION</text>
<text x="562.33" y="420.00" font-size="2.55" text-anchor="start" fill="#141414">FSD = fabricator shop decision.</text>
<text x="562.33" y="424.70" font-size="2.55" text-anchor="start" fill="#141414">Do not drill until the Jay GO</text>
<text x="562.33" y="429.40" font-size="2.55" text-anchor="start" fill="#141414">box on this sheet is signed.</text>
<text x="562.33" y="434.10" font-size="2.55" text-anchor="start" fill="#141414">Do not invent a bolt grade.</text>
<text x="562.33" y="438.80" font-size="2.55" text-anchor="start" fill="#141414">Confirm the rail section</text>
<text x="562.33" y="443.50" font-size="2.55" text-anchor="start" fill="#141414">as-found before any pattern.</text>
<text x="562.33" y="448.20" font-size="2.55" text-anchor="start" fill="#141414">H3 jig holes are not rail holes.</text>
<text x="562.33" y="452.90" font-size="2.55" text-anchor="start" fill="#141414">Unsigned box = NO-GO cut / drill.</text>
