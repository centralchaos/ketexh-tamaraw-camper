<text x="24.00" y="88.00" font-size="2.80" text-anchor="start" fill="#141414">SHELL W 1911 = BED 1711 + 100/SIDE.</text>
<text x="24.00" y="100.00" font-size="2.80" text-anchor="start" fill="#141414">Cab width is chassis reference,</text>
<text x="24.00" y="112.00" font-size="2.80" text-anchor="start" fill="#141414">not a shell cut.</text>
<text x="24.00" y="132.00" font-size="2.80" text-anchor="start" fill="#141414">SHELL EXT H ≈ 1830 — SEE S-01 / S-04.</text>
<text x="24.00" y="152.00" font-size="2.80" text-anchor="start" fill="#141414">Wheels and cab are schematic.</text>
<text x="24.00" y="172.00" font-size="2.80" text-anchor="start" fill="#141414">No interior. No Phase-2 gear.</text>
