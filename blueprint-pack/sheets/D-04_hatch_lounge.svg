<text x="648.00" y="540.00" font-size="5.00" text-anchor="start" fill="#141414" font-weight="bold">D-04</text>
<text x="648.00" y="556.00" font-size="3.20" text-anchor="start" fill="#141414">NTS — DO NOT SCALE</text>
<text x="648.00" y="572.00" font-size="2.30" text-anchor="start" fill="#141414">VIEWS NAMED ON SHEET</text>
