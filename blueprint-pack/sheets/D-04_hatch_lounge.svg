<text x="108.00" y="48.00" font-size="2.50" text-anchor="start" fill="#141414" font-weight="bold">HINGE — FORWARD EDGE</text>
<text x="150.00" y="130.00" font-size="2.60" text-anchor="start" fill="#141414" font-weight="bold">OPENING</text>
<text x="150.00" y="142.00" font-size="2.40" text-anchor="start" fill="#141414">SIZE TBD</text>
<text x="210.00" y="236.00" font-size="2.40" text-anchor="start" fill="#141414">RAIL POSTS INTO SILLS</text>
<text x="36.00" y="248.00" font-size="2.50" text-anchor="start" fill="#141414" font-weight="bold">FRAME IS STRUCTURE. NOT A CUT IN THE SKIN ALONE.</text>
<rect x="428.00" y="16.00" width="397.00" height="248.00" fill="#ffffff" stroke="#141414" stroke-width="0.45"/>
<rect x="428.00" y="16.00" width="397.00" height="8.00" fill="#141414" stroke="none" stroke-width="0.35"/>
<text x="430.50" y="21.70" font-size="3.00" text-anchor="start" fill="#ffffff" font-weight="bold">2  SECTION — HATCH CLOSED (NTS)</text>
<rect x="470.00" y="120.00" width="220.00" height="14.00" fill="url(#hatch)" stroke="#141414" stroke-width="0.4"/>
<rect x="560.00" y="100.00" width="90.00" height="14.00" fill="#f4f4f4" stroke="#141414" stroke-width="0.45"/>
<rect x="548.00" y="114.00" width="12.00" height="28.00" fill="#ffffff" stroke="#141414" stroke-width="0.45"/>
<rect x="640.00" y="114.00" width="12.00" height="28.00" fill="#ffffff" stroke="#141414" stroke-width="0.45"/>
<line x1="560.00" y1="96.00" x2="650.00" y2="70.00" stroke="#141414" stroke-width="0.35" fill="none" stroke-dasharray="2.2 1.3"/>
<text x="470.00" y="64.00" font-size="2.50" text-anchor="start" fill="#141414">DASHED LEAF = OPEN, PARKED ONLY</text>
<text x="470.00" y="160.00" font-size="2.55" text-anchor="start" fill="#141414" font-weight="bold">CLOSED LEAF ON A FRAMED SILL</text>
<text x="470.00" y="176.00" font-size="2.50" text-anchor="start" fill="#141414">CONTINUOUS SEAL — PRODUCT TBD</text>
<text x="470.00" y="192.00" font-size="2.50" text-anchor="start" fill="#141414">HINGE AND STRUT LAND ON THE FRAME</text>
<text x="470.00" y="208.00" font-size="2.60" text-anchor="start" fill="#141414" font-weight="bold">OAH ≤ 2500 = THIS CLOSED POSITION</text>
<text x="470.00" y="228.00" font-size="2.50" text-anchor="start" fill="#141414">WELD SIZE TBD. NO SKIN-ONLY CUT.</text>
<text x="470.00" y="244.00" font-size="2.45" text-anchor="start" fill="#141414">HOSE THE CLOSED PERIMETER BEFORE ANY LOUNGE CLAIM.</text>
<rect x="16.00" y="274.00" width="250.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="141.00" y="286.00" font-size="2.90" text-anchor="middle" fill="#9b1c1c" font-weight="bold">ENG FAIL-IF</text>
<text x="141.00" y="298.00" font-size="2.35" text-anchor="middle" fill="#9b1c1c">OPEN CUT WITHOUT A SEALED FRAME</text>
<rect x="276.00" y="274.00" width="270.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="411.00" y="286.00" font-size="2.90" text-anchor="middle" fill="#9b1c1c" font-weight="bold">FIELD FAIL-IF</text>
<text x="411.00" y="298.00" font-size="2.35" text-anchor="middle" fill="#9b1c1c">NO SEAL · NO RAIL · WATER IN LOUNGE</text>
<rect x="556.00" y="274.00" width="268.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="690.00" y="286.00" font-size="2.90" text-anchor="middle" fill="#9b1c1c" font-weight="bold">FIELD FAIL-IF</text>
<text x="690.00" y="298.00" font-size="2.35" text-anchor="middle" fill="#9b1c1c">HATCH OPEN ON THE ROAD</text>
<rect x="16.00" y="318.00" width="250.00" height="26.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.55"/>
<rect x="24.00" y="324.00" width="7.00" height="7.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="38.00" y="330.00" font-size="2.60" text-anchor="start" fill="#141414" font-weight="bold">JAY GO — STILL NO RAIL DRILL</text>
<text x="280.00" y="330.00" font-size="2.55" text-anchor="start" fill="#141414">OCCUPIED ROOF = PARKED ONLY.  HATCH CLOSED AND RAILS UP BEFORE DRIVE.</text>
<rect x="16.00" y="354.00" width="265.67" height="146.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="19.00" y="362.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">ENG — FRAME</text>
<text x="19.00" y="370.00" font-size="2.55" text-anchor="start" fill="#141414">Opening is a framed hole in the</text>
<text x="19.00" y="374.70" font-size="2.55" text-anchor="start" fill="#141414">shell structure, not a skin cut.</text>
<text x="19.00" y="379.40" font-size="2.55" text-anchor="start" fill="#141414">Continuous seal to that frame.</text>
<text x="19.00" y="384.10" font-size="2.55" text-anchor="start" fill="#141414">Hinge and strut hardpoints land</text>
<text x="19.00" y="388.80" font-size="2.55" text-anchor="start" fill="#141414">on the frame, not on the sheet.</text>
<text x="19.00" y="393.50" font-size="2.55" text-anchor="start" fill="#141414">Rail posts go into roof rails</text>
<text x="19.00" y="398.20" font-size="2.55" text-anchor="start" fill="#141414">or sills. Weld size TBD.</text>
<text x="19.00" y="402.90" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF an open cut has no</text>
<text x="19.00" y="407.60" font-size="2.55" text-anchor="start" fill="#141414">sealed hatch frame.</text>
<rect x="287.67" y="354.00" width="265.67" height="146.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="290.67" y="362.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FIELD IoT — WATER / ROAD</text>
<text x="290.67" y="370.00" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF open cut, no sealed hatch.</text>
<text x="290.67" y="374.70" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF the rail is missing.</text>
<text x="290.67" y="379.40" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF water enters the lounge.</text>
<text x="290.67" y="384.10" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF the hatch is open on road.</text>
<text x="290.67" y="388.80" font-size="2.55" text-anchor="start" fill="#141414">Hose the closed perimeter before</text>
<text x="290.67" y="393.50" font-size="2.55" text-anchor="start" fill="#141414">any parked-lounge claim.</text>
<text x="290.67" y="398.20" font-size="2.55" text-anchor="start" fill="#141414">Occupied roof is parked only.</text>
<text x="290.67" y="402.90" font-size="2.55" text-anchor="start" fill="#141414">OAH ≤ 2500 means hatch closed.</text>
<rect x="559.33" y="354.00" width="265.67" height="146.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="562.33" y="362.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FSD — SHOP DECISION</text>
<text x="562.33" y="370.00" font-size="2.55" text-anchor="start" fill="#141414">FSD = fabricator shop decision.</text>
<text x="562.33" y="374.70" font-size="2.55" text-anchor="start" fill="#141414">Do not cut the roof from a render.</text>
<text x="562.33" y="379.40" font-size="2.55" text-anchor="start" fill="#141414">Opening size stays TBD.</text>
<text x="562.33" y="384.10" font-size="2.55" text-anchor="start" fill="#141414">Sealant and weld size stay TBD.</text>
<text x="562.33" y="388.80" font-size="2.55" text-anchor="start" fill="#141414">Do not call the lounge done</text>
<text x="562.33" y="393.50" font-size="2.55" text-anchor="start" fill="#141414">while the hatch is unsealed.</text>
<text x="562.33" y="398.20" font-size="2.55" text-anchor="start" fill="#141414">Jay GO on D-01 still governs</text>
<text x="562.33" y="402.90" font-size="2.55" text-anchor="start" fill="#141414">any chassis-rail hole.</text>
<text x="562.33" y="407.60" font-size="2.55" text-anchor="start" fill="#141414">R&amp;D build. Renders are not cut geometry.</text>
