<polygon points="150.00,150.00 146.00,142.00 154.00,142.00" fill="#141414" stroke="none" stroke-width="0.5" stroke-linejoin="miter"/>
<text x="70.00" y="48.00" font-size="2.45" text-anchor="start" fill="#141414" font-weight="bold">CURB FRAME — SIZE TBD</text>
<text x="70.00" y="168.00" font-size="2.40" text-anchor="start" fill="#141414" font-weight="bold">ROOF RAIL</text>
<text x="170.00" y="168.00" font-size="2.40" text-anchor="start" fill="#141414" font-weight="bold">CONDENSATE TO WEEP</text>
<text x="170.00" y="182.00" font-size="2.35" text-anchor="start" fill="#141414">NOT INTO THE CABIN CAVITY</text>
<text x="40.00" y="206.00" font-size="2.45" text-anchor="start" fill="#9b1c1c" font-weight="bold">FAIL-IF THE CURB IS SCREWED TO SKIN ONLY.</text>
<text x="40.00" y="222.00" font-size="2.40" text-anchor="start" fill="#141414">NO BTU. NO UNIT MODEL. OPENING SIZE TBD.</text>
<rect x="528.00" y="16.00" width="297.00" height="228.00" fill="#ffffff" stroke="#141414" stroke-width="0.45"/>
<rect x="528.00" y="16.00" width="297.00" height="8.00" fill="#141414" stroke="none" stroke-width="0.35"/>
<text x="530.50" y="21.70" font-size="3.00" text-anchor="start" fill="#ffffff" font-weight="bold">2  ROAD AND HOSE</text>
<text x="544.00" y="44.00" font-size="2.55" text-anchor="start" fill="#141414" font-weight="bold">OAH ≤ 2500 MEANS</text>
<text x="544.00" y="60.00" font-size="2.40" text-anchor="start" fill="#141414">hatch closed AND the</text>
<text x="544.00" y="74.00" font-size="2.40" text-anchor="start" fill="#141414">curb is installed.</text>
<text x="544.00" y="96.00" font-size="2.55" text-anchor="start" fill="#141414" font-weight="bold">ON THE ROAD</text>
<text x="544.00" y="112.00" font-size="2.40" text-anchor="start" fill="#141414">Sealed unit, or a blanked</text>
<text x="544.00" y="126.00" font-size="2.40" text-anchor="start" fill="#141414">cover. Not an open curb.</text>
<text x="544.00" y="148.00" font-size="2.50" text-anchor="start" fill="#141414" font-weight="bold">HOSE THE CLOSED CURB</text>
<text x="544.00" y="164.00" font-size="2.40" text-anchor="start" fill="#141414">perimeter with D-03</text>
<text x="544.00" y="178.00" font-size="2.40" text-anchor="start" fill="#141414">before any claim.</text>
<text x="544.00" y="202.00" font-size="2.50" text-anchor="start" fill="#9b1c1c" font-weight="bold">UNIT IS NOT CUT DONE.</text>
<text x="544.00" y="218.00" font-size="2.45" text-anchor="start" fill="#141414" font-weight="bold">NOT A BUY LIST.</text>
<rect x="16.00" y="254.00" width="260.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="146.00" y="266.00" font-size="2.70" text-anchor="middle" fill="#9b1c1c" font-weight="bold">FAIL-IF CURB IS SKIN-ONLY</text>
<text x="146.00" y="278.00" font-size="2.30" text-anchor="middle" fill="#9b1c1c">TIE IT TO THE ROOF RAILS</text>
<rect x="286.00" y="254.00" width="260.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="416.00" y="266.00" font-size="2.70" text-anchor="middle" fill="#9b1c1c" font-weight="bold">FAIL-IF CONDENSATE IN CABIN</text>
<text x="416.00" y="278.00" font-size="2.30" text-anchor="middle" fill="#9b1c1c">OR INTO THE LOUNGE</text>
<rect x="556.00" y="254.00" width="268.00" height="36.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.7"/>
<text x="690.00" y="266.00" font-size="2.70" text-anchor="middle" fill="#9b1c1c" font-weight="bold">FAIL-IF THE CURB IS OPEN</text>
<text x="690.00" y="278.00" font-size="2.30" text-anchor="middle" fill="#9b1c1c">ON THE ROAD</text>
<rect x="16.00" y="298.00" width="250.00" height="28.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.55"/>
<rect x="24.00" y="306.00" width="7.00" height="7.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="38.00" y="312.00" font-size="2.45" text-anchor="start" fill="#141414" font-weight="bold">ENG GO — CURB JOINT UNSIGNED</text>
<rect x="276.00" y="298.00" width="250.00" height="28.00" fill="#ffffff" stroke="#9b1c1c" stroke-width="0.55"/>
<rect x="284.00" y="306.00" width="7.00" height="7.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="298.00" y="312.00" font-size="2.45" text-anchor="start" fill="#141414" font-weight="bold">JAY GO — RAIL DRILL UNSIGNED</text>
<rect x="536.00" y="298.00" width="288.00" height="28.00" fill="#ffffff" stroke="#141414" stroke-width="0.45"/>
<text x="548.00" y="312.00" font-size="2.50" text-anchor="start" fill="#141414" font-weight="bold">SEALANT AND COVER: TBD</text>
<rect x="16.00" y="336.00" width="265.67" height="164.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="19.00" y="344.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">ENG — CURB</text>
<text x="19.00" y="352.00" font-size="2.55" text-anchor="start" fill="#141414">Curb frame ties into roof rails.</text>
<text x="19.00" y="356.70" font-size="2.55" text-anchor="start" fill="#141414">It is not a skin-only angle.</text>
<text x="19.00" y="361.40" font-size="2.55" text-anchor="start" fill="#141414">Condensate goes to the weep.</text>
<text x="19.00" y="366.10" font-size="2.55" text-anchor="start" fill="#141414">It does not enter the cavity.</text>
<text x="19.00" y="370.80" font-size="2.55" text-anchor="start" fill="#141414">Hose the closed perimeter.</text>
<text x="19.00" y="375.50" font-size="2.55" text-anchor="start" fill="#141414">OAH ≤ 2500 is hatch closed</text>
<text x="19.00" y="380.20" font-size="2.55" text-anchor="start" fill="#141414">with the curb in place.</text>
<text x="19.00" y="384.90" font-size="2.55" text-anchor="start" fill="#141414">Opening size stays TBD.</text>
<text x="19.00" y="389.60" font-size="2.55" text-anchor="start" fill="#141414">No BTU is stated.</text>
<rect x="287.67" y="336.00" width="265.67" height="164.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="290.67" y="344.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FIELD — WATER / ROAD</text>
<text x="290.67" y="352.00" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF the curb is skin-only.</text>
<text x="290.67" y="356.70" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF condensate enters the</text>
<text x="290.67" y="361.40" font-size="2.55" text-anchor="start" fill="#141414">cabin or the lounge.</text>
<text x="290.67" y="366.10" font-size="2.55" text-anchor="start" fill="#141414">FAIL-IF the curb is open</text>
<text x="290.67" y="370.80" font-size="2.55" text-anchor="start" fill="#141414">while the vehicle is on road.</text>
<text x="290.67" y="375.50" font-size="2.55" text-anchor="start" fill="#141414">Road state is a sealed unit</text>
<text x="290.67" y="380.20" font-size="2.55" text-anchor="start" fill="#141414">or a blanked cover.</text>
<text x="290.67" y="384.90" font-size="2.55" text-anchor="start" fill="#141414">Hose this joint with D-03.</text>
<text x="290.67" y="389.60" font-size="2.55" text-anchor="start" fill="#141414">The unit is not cut Done.</text>
<rect x="559.33" y="336.00" width="265.67" height="164.00" fill="#ffffff" stroke="#141414" stroke-width="0.4"/>
<text x="562.33" y="344.00" font-size="3.15" text-anchor="start" fill="#141414" font-weight="bold">FSD — NOT A BUY LIST</text>
<text x="562.33" y="352.00" font-size="2.55" text-anchor="start" fill="#141414">FSD = fabricator shop decision.</text>
<text x="562.33" y="356.70" font-size="2.55" text-anchor="start" fill="#141414">Do not order an AC unit from</text>
<text x="562.33" y="361.40" font-size="2.55" text-anchor="start" fill="#141414">this sheet.</text>
<text x="562.33" y="366.10" font-size="2.55" text-anchor="start" fill="#141414">Do not cut the roof skin for</text>
<text x="562.33" y="370.80" font-size="2.55" text-anchor="start" fill="#141414">a curb until D-04 and D-08</text>
<text x="562.33" y="375.50" font-size="2.55" text-anchor="start" fill="#141414">both still say the opening</text>
<text x="562.33" y="380.20" font-size="2.55" text-anchor="start" fill="#141414">is unreleased.</text>
<text x="562.33" y="384.90" font-size="2.55" text-anchor="start" fill="#141414">Sealant stays TBD.</text>
<text x="562.33" y="389.60" font-size="2.55" text-anchor="start" fill="#141414">Jay GO still gates rail holes.</text>
<text x="562.33" y="394.30" font-size="2.55" text-anchor="start" fill="#141414">Not an LTO release.</text>
