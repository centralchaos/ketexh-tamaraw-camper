<text x="17.40" y="44.02" font-size="2.25" text-anchor="start" fill="#141414" font-weight="bold">STEP</text>
<text x="57.40" y="44.02" font-size="2.25" text-anchor="start" fill="#141414" font-weight="bold">ACTION</text>
<text x="397.40" y="44.02" font-size="2.25" text-anchor="start" fill="#141414" font-weight="bold">SHEET</text>
<text x="507.40" y="44.02" font-size="2.25" text-anchor="start" fill="#141414" font-weight="bold">HOLD</text>
<text x="17.40" y="62.52" font-size="2.25" text-anchor="start" fill="#141414">01</text>
<text x="57.40" y="62.52" font-size="2.25" text-anchor="start" fill="#141414">Tape bed, rails, cab roof, VIN. Freeze traveler.</text>
<text x="397.40" y="62.52" font-size="2.25" text-anchor="start" fill="#141414">DIMS</text>
<text x="507.40" y="62.52" font-size="2.25" text-anchor="start" fill="#141414">AS-FOUND</text>
<text x="17.40" y="81.02" font-size="2.25" text-anchor="start" fill="#141414">02</text>
<text x="57.40" y="81.02" font-size="2.25" text-anchor="start" fill="#141414">Cut floor longs 3647. Do not drill.</text>
<text x="397.40" y="81.02" font-size="2.25" text-anchor="start" fill="#141414">C-FR F-01</text>
<text x="507.40" y="81.02" font-size="2.25" text-anchor="start" fill="#141414">ENG section</text>
<text x="17.40" y="99.52" font-size="2.25" text-anchor="start" fill="#141414">03</text>
<text x="57.40" y="99.52" font-size="2.25" text-anchor="start" fill="#141414">Dry-fit bed-tail splice. Weld after Eng GO.</text>
<text x="397.40" y="99.52" font-size="2.25" text-anchor="start" fill="#141414">J-01</text>
<text x="507.40" y="99.52" font-size="2.25" text-anchor="start" fill="#141414">ENG weld</text>
<text x="17.40" y="118.02" font-size="2.25" text-anchor="start" fill="#141414">04</text>
<text x="57.40" y="118.02" font-size="2.25" text-anchor="start" fill="#141414">Outriggers from as-found pitch.</text>
<text x="397.40" y="118.02" font-size="2.25" text-anchor="start" fill="#141414">F-01 D-01</text>
<text x="507.40" y="118.02" font-size="2.25" text-anchor="start" fill="#141414">AS-FOUND</text>
<text x="17.40" y="136.51" font-size="2.25" text-anchor="start" fill="#141414">05</text>
<text x="57.40" y="136.51" font-size="2.25" text-anchor="start" fill="#141414">Drill rails only after Jay GO.</text>
<text x="397.40" y="136.51" font-size="2.25" text-anchor="start" fill="#141414">FS-01</text>
<text x="507.40" y="136.51" font-size="2.25" text-anchor="start" fill="#141414">JAY GO</text>
<text x="17.40" y="155.01" font-size="2.25" text-anchor="start" fill="#141414">06</text>
<text x="57.40" y="155.01" font-size="2.25" text-anchor="start" fill="#141414">Bolt frame to rails with backing plates.</text>
<text x="397.40" y="155.01" font-size="2.25" text-anchor="start" fill="#141414">C-PL</text>
<text x="507.40" y="155.01" font-size="2.25" text-anchor="start" fill="#141414">JAY GO</text>
<text x="17.40" y="173.51" font-size="2.25" text-anchor="start" fill="#141414">07</text>
<text x="57.40" y="173.51" font-size="2.25" text-anchor="start" fill="#141414">Stand posts. Cut length = as-found H.</text>
<text x="397.40" y="173.51" font-size="2.25" text-anchor="start" fill="#141414">F-02</text>
<text x="507.40" y="173.51" font-size="2.25" text-anchor="start" fill="#141414">AS-FOUND H</text>
<text x="17.40" y="192.01" font-size="2.25" text-anchor="start" fill="#141414">08</text>
<text x="57.40" y="192.01" font-size="2.25" text-anchor="start" fill="#141414">Sills and mid posts. Mid count = Eng.</text>
<text x="397.40" y="192.01" font-size="2.25" text-anchor="start" fill="#141414">F-02</text>
<text x="507.40" y="192.01" font-size="2.25" text-anchor="start" fill="#141414">ENG</text>
<text x="17.40" y="210.51" font-size="2.25" text-anchor="start" fill="#141414">09</text>
<text x="57.40" y="210.51" font-size="2.25" text-anchor="start" fill="#141414">Over-cab ring. Cab roof is not the beam.</text>
<text x="397.40" y="210.51" font-size="2.25" text-anchor="start" fill="#141414">J-01</text>
<text x="507.40" y="210.51" font-size="2.25" text-anchor="start" fill="#141414">ENG</text>
<text x="17.40" y="229.01" font-size="2.25" text-anchor="start" fill="#141414">10</text>
<text x="57.40" y="229.01" font-size="2.25" text-anchor="start" fill="#141414">Close hatch frame before any roof opening.</text>
<text x="397.40" y="229.01" font-size="2.25" text-anchor="start" fill="#141414">F-03</text>
<text x="507.40" y="229.01" font-size="2.25" text-anchor="start" fill="#141414">D-04</text>
<text x="17.40" y="247.51" font-size="2.25" text-anchor="start" fill="#141414">11</text>
<text x="57.40" y="247.51" font-size="2.25" text-anchor="start" fill="#141414">Hang skins. Leave dashed openings uncut.</text>
<text x="397.40" y="247.51" font-size="2.25" text-anchor="start" fill="#141414">C-01…C-06</text>
<text x="507.40" y="247.51" font-size="2.25" text-anchor="start" fill="#141414">FIELD</text>
<text x="17.40" y="266.01" font-size="2.25" text-anchor="start" fill="#141414">12</text>
<text x="57.40" y="266.01" font-size="2.25" text-anchor="start" fill="#141414">Field-locate entry 700×1550 on P2.</text>
<text x="397.40" y="266.01" font-size="2.25" text-anchor="start" fill="#141414">DR-02</text>
<text x="507.40" y="266.01" font-size="2.25" text-anchor="start" fill="#141414">FIELD</text>
<text x="17.40" y="284.51" font-size="2.25" text-anchor="start" fill="#141414">13</text>
<text x="57.40" y="284.51" font-size="2.25" text-anchor="start" fill="#141414">Door leaf. Hinges to the jamb post.</text>
<text x="397.40" y="284.51" font-size="2.25" text-anchor="start" fill="#141414">DR-01</text>
<text x="507.40" y="284.51" font-size="2.25" text-anchor="start" fill="#141414">ENG</text>
<text x="17.40" y="303.01" font-size="2.25" text-anchor="start" fill="#141414">14</text>
<text x="57.40" y="303.01" font-size="2.25" text-anchor="start" fill="#141414">Hatch leaves. Sizes still TBD.</text>
<text x="397.40" y="303.01" font-size="2.25" text-anchor="start" fill="#141414">H-01 H-02</text>
<text x="507.40" y="303.01" font-size="2.25" text-anchor="start" fill="#141414">D-04</text>
<text x="17.40" y="321.51" font-size="2.25" text-anchor="start" fill="#141414">15</text>
<text x="57.40" y="321.51" font-size="2.25" text-anchor="start" fill="#141414">Seal. Hose test.</text>
<text x="397.40" y="321.51" font-size="2.25" text-anchor="start" fill="#141414">QA-01</text>
<text x="507.40" y="321.51" font-size="2.25" text-anchor="start" fill="#141414">HOSE</text>
<text x="17.40" y="340.01" font-size="2.25" text-anchor="start" fill="#141414">16</text>
<text x="57.40" y="340.01" font-size="2.25" text-anchor="start" fill="#141414">Legs and bumper after D-02 and D-06.</text>
<text x="397.40" y="340.01" font-size="2.25" text-anchor="start" fill="#141414">D-02 D-06</text>
<text x="507.40" y="340.01" font-size="2.25" text-anchor="start" fill="#141414">GATES</text>
<text x="17.40" y="358.51" font-size="2.25" text-anchor="start" fill="#141414">17</text>
<text x="57.40" y="358.51" font-size="2.25" text-anchor="start" fill="#141414">Gen bay and AC curb provisions only.</text>
<text x="397.40" y="358.51" font-size="2.25" text-anchor="start" fill="#141414">D-07 D-08</text>
<text x="507.40" y="358.51" font-size="2.25" text-anchor="start" fill="#141414">NOT UNITS</text>
<text x="17.40" y="377.01" font-size="2.25" text-anchor="start" fill="#141414">18</text>
<text x="57.40" y="377.01" font-size="2.25" text-anchor="start" fill="#141414">Weigh. Placard stays blank until then.</text>
<text x="397.40" y="377.01" font-size="2.25" text-anchor="start" fill="#141414">D-02</text>
<text x="507.40" y="377.01" font-size="2.25" text-anchor="start" fill="#141414">WEIGH</text>
<text x="18.00" y="430.00" font-size="2.45" text-anchor="start" fill="#141414" font-weight="bold">STEP 17 DOES NOT BUY A GENERATOR OR AN AC UNIT. PARKED-ONLY GEN RUN. OPEN HATCH IS PARKED ONLY.</text>
<text x="18.00" y="448.00" font-size="2.45" text-anchor="start" fill="#141414">OAH ≤ 2500 IS HATCH CLOSED, AND WITH THE CURB INSTALLED IF THAT PROVISION IS BUILT.</text>
