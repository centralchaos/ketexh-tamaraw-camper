<title>AS-01 — ASSEMBLY SEQUENCE — PHASE-1 SHELL</title>
<desc>KE-Texh TAMARAW Phase-1 SHELL. REV CONDITIONAL. PRELIMINARY — VERIFY ON VEHICLE — NOT LTO-CERTIFIED. R and D fabricator sheet. Gates unsigned = do not cut. NO-GO cut steel until gates.</desc>
