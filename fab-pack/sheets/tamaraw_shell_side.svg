<g class="dim">
        <line x1="4650" y1="-340" x2="5650" y2="-340"/>
        <line x1="4650" y1="-370" x2="4650" y2="-310"/>
        <line x1="5650" y1="-370" x2="5650" y2="-310"/>
        <polygon points="4650,-340 4664,-346 4664,-334"/>
        <polygon points="5650,-340 5636,-346 5636,-334"/>
        <text transform="scale(1,-1)" x="5150.0" y="398"
              text-anchor="middle" font-size="52">TAIL EXT +1000 mm</text>
      </g>
<g class="dim">
        <line x1="2003" y1="-520" x2="5650" y2="-520"/>
        <line x1="2003" y1="-550" x2="2003" y2="-490"/>
        <line x1="5650" y1="-550" x2="5650" y2="-490"/>
        <polygon points="2003,-520 2017,-526 2017,-514"/>
        <polygon points="5650,-520 5636,-526 5636,-514"/>
        <text transform="scale(1,-1)" x="3826.5" y="578"
