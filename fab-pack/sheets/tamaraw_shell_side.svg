      </g>
<g class="dim">
        <line x1="780" y1="2650" x2="2003" y2="2650"/>
        <line x1="780" y1="2620" x2="780" y2="2680"/>
        <line x1="2003" y1="2620" x2="2003" y2="2680"/>
        <polygon points="780,2650 794,2644 794,2656"/>
        <polygon points="2003,2650 1989,2644 1989,2656"/>
        <text transform="scale(1,-1)" x="1391.5" y="-2708"
