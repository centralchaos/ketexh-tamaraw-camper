      <rect class="stroke-rail" x="1973" y="590" width="2707" height="80"/>
      <circle class="wheel" cx="550" cy="320" r="320"/>
      <circle class="wheel-hub" cx="550" cy="320" r="134"/>
      <circle class="wheel" cx="3635" cy="320" r="320"/>
      <circle class="wheel-hub" cx="3635" cy="320" r="134"/>
      <rect class="opening" x="900" y="1200" width="700" height="480"/>
    </g>
    <g id="shell_box" inkscape:groupmode="layer" inkscape:label="shell_box">
