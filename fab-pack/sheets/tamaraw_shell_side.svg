<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="6900mm" height="4180mm"
     viewBox="-200 -3280 6900 4180"
     role="img" aria-label="KE-Texh Tamaraw Phase-1 camper shell side elevation mm">
  <rect id="background" x="-200" y="-3280" width="6900" height="4180" fill="#ffffff"/>
  <title>tamaraw_shell_side — Phase-1 shell side elevation</title>
  <desc>Tall over-cab ROOM, continuous high roof ≤2500 mm, shell floor 3647 mm (bed 2647 + TAIL EXT 1000), rear ~2015 mm past axle, vertical flat back. Overall ≈6300 mm. PRELIMINARY — VERIFY ON VEHICLE — NOT LTO-CERTIFIED. Weight/overhang/LTO risk.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .stroke-main { fill:#ffffff; stroke:#000000; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
      .stroke-cab  { fill:#f0f0f0; stroke:#000000; stroke-width:3; stroke-linejoin:round; }
      .stroke-rail { fill:#666666; stroke:#000000; stroke-width:2; }
      .opening { fill:none; stroke:#000000; stroke-width:2.5; }
      .opening-door { fill:none; stroke:#000000; stroke-width:2.5; stroke-dasharray:20 12; }
      .opening-opt { fill:none; stroke:#000000; stroke-width:2; stroke-dasharray:10 8; }
      .wheel { fill:#111111; stroke:#000000; stroke-width:3; }
      .wheel-hub { fill:#cccccc; stroke:#000000; stroke-width:2; }
      .ground { fill:none; stroke:#444444; stroke-width:2; }
      .dim line { stroke:#000000; stroke-width:1.5; fill:none; }
      .dim polygon { fill:#000000; stroke:none; }
      .dim text { fill:#000000; font-family:DejaVu Sans, Arial, sans-serif; }
      .leader line { stroke:#000000; stroke-width:1.2; fill:none; }
      .leader text { fill:#000000; font-family:DejaVu Sans, Arial, sans-serif; }
      .title { fill:#000000; font-family:DejaVu Sans, Arial, sans-serif; font-size:76px; font-weight:bold; }
      .note { fill:#222222; font-family:DejaVu Sans, Arial, sans-serif; font-size:40px; }
      .watermark { fill:#000000; font-family:DejaVu Sans, Arial, sans-serif; font-size:46px; font-weight:bold; }
      .sep { stroke:#000000; stroke-width:1.5; fill:none; }
    ]]></style>
  </defs>

  <g id="titleblock">
    <text class="title" x="-160" y="-3205">KE-Texh Tamaraw — Phase-1 SHELL side elevation (mm)</text>
    <text class="watermark" x="-160" y="-3133">PRELIMINARY — VERIFY ON VEHICLE — NOT LTO-CERTIFIED</text>
    <text class="note" x="-160" y="-3075">Shape: tall over-cab ROOM · continuous high roof · long rear · vertical flat back · entry + 2 body windows + over-cab window</text>
    <text class="note" x="-160" y="-3017">DIM TABLE — Shell floor L 3647 (= bed 2647 + TAIL EXT 1000) · Shell W 1911 (+100/side) · Shell ext. H ≈ 1830 · Loft ≈ 700 · WB 3085 · Clear H 1900–2000</text>
    <text class="note" x="-160" y="-2959">BODY EXT beyond dropside +1000 mm · width +100 mm/side (SHELL_W 1911) · weight / rear overhang / LTO risk · PRELIMINARY · VERIFY ON VEHICLE · NOT LTO-CERTIFIED · fabricator schematic</text>
    <line class="sep" x1="-160" y1="-2919" x2="6620" y2="-2919"/>
  </g>

