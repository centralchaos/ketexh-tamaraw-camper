      </g>
<g class="leader">
        <line x1="2433.0" y1="2260" x2="2433.0" y2="2820"/>
        <circle cx="2433.0" cy="2260" r="5" fill="#000"/>
        <text transform="scale(1,-1)" x="2433.0" y="-2838"
              text-anchor="middle" font-size="44"
              font-family="DejaVu Sans, Arial, sans-serif">ENTRY 700×1550</text>
      </g>
<g class="leader">
        <line x1="3313.0" y1="2270" x2="3313.0" y2="2820"/>
        <circle cx="3313.0" cy="2270" r="5" fill="#000"/>
        <text transform="scale(1,-1)" x="3313.0" y="-2838"
              text-anchor="middle" font-size="44"
