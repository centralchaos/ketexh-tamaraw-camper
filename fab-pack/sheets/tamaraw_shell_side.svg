      </g>
<g class="dim">
        <line x1="5870" y1="0" x2="5870" y2="2500"/>
        <line x1="5840" y1="0" x2="5900" y2="0"/>
        <line x1="5840" y1="2500" x2="5900" y2="2500"/>
        <polygon points="5870,0 5864,14 5876,14"/>
