      </g>
<g class="leader">
        <line x1="4253.0" y1="2270" x2="4253.0" y2="2820"/>
        <circle cx="4253.0" cy="2270" r="5" fill="#000"/>
        <text transform="scale(1,-1)" x="4253.0" y="-2838"
